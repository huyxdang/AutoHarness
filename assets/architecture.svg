<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="999" height="469" rx="16" fill="#ffffff" stroke="#d8dee4"/><text x="32" y="46" font-size="20" font-weight="600" fill="#1f2328">How a round runs</text><text x="32" y="72" font-size="14" fill="#59636e">Train tasks show the optimizer what failed; dev tasks decide whether its edit is kept. Test tasks are run once at the end.</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#57606a" stroke-width="1.6"/></marker></defs><rect x="32" y="110" width="200" height="132" rx="10" fill="#fdf0ee" stroke="#d9695f" stroke-width="1.5"/><text x="48" y="138" font-size="14.5" font-weight="600" fill="#1f2328">Optimizer</text><text x="48" y="162" font-size="12.5" fill="#59636e">Claude Code, headless</text><text x="48" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">claude -p</text><text x="48" y="200" font-size="12.5" fill="#59636e">reads failed train runs</text><text x="48" y="219" font-size="12.5" fill="#59636e">+ its edit history</text><rect x="282" y="110" width="200" height="132" rx="10" fill="#eef4ff" stroke="#2f6ff0" stroke-width="1.5"/><text x="298" y="138" font-size="14.5" font-weight="600" fill="#1f2328">Harness</text><text x="298" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">prompt.txt</text><text x="298" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">react_agent.py</text><text x="298" y="200" font-size="12.5" fill="#59636e">the only files the</text><text x="298" y="219" font-size="12.5" fill="#59636e">optimizer may edit</text><rect x="532" y="110" width="210" height="132" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="548" y="138" font-size="14.5" font-weight="600" fill="#1f2328">AppWorld tasks</text><text x="548" y="162" font-size="12.5" fill="#59636e">Modal CPU containers,</text><text x="548" y="181" font-size="12.5" fill="#59636e">one per task</text><text x="548" y="200" font-size="12.5" fill="#59636e">agent loop + app APIs</text><text x="548" y="219" font-size="12.5" fill="#59636e">graded by unit tests</text><rect x="792" y="110" width="176" height="132" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="808" y="138" font-size="14.5" font-weight="600" fill="#1f2328">Solver model</text><text x="808" y="162" font-size="12.5" fill="#59636e">SGLang on Modal GPU</text><text x="808" y="181" font-size="12.5" fill="#59636e">Qwen3.5-9B · L40S</text><text x="808" y="200" font-size="12.5" fill="#59636e">Qwen3.5-27B · H100</text><text x="808" y="219" font-size="12.5" fill="#59636e">OpenAI-compatible API</text><rect x="282" y="322" width="200" height="96" rx="10" fill="#ffffff" stroke="#2f6ff0" stroke-width="1.5"/><text x="298" y="350" font-size="14.5" font-weight="600" fill="#1f2328">Dev gate</text><text x="298" y="374" font-size="12.5" fill="#59636e">loop.py: keep only if</text><text x="298" y="393" font-size="12.5" fill="#59636e">dev pass@1 improves</text><rect x="532" y="322" width="210" height="96" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="548" y="350" font-size="14.5" font-weight="600" fill="#1f2328">Run results</text><text x="548" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">results/*/summary.json</text><text x="548" y="393" font-size="12.5" fill="#59636e">pass@1, tests, tokens</text><path d="M232 176 L278 176" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/><text x="255" y="168" font-size="12" fill="#59636e" text-anchor="middle">edits</text><path d="M482 176 L528 176" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/><text x="505" y="168" font-size="12" fill="#59636e" text-anchor="middle">runs</text><path d="M742 164 L788 164" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/><path d="M788 190 L742 190" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/><text x="765" y="156" font-size="11" fill="#59636e" text-anchor="middle">chat</text><path d="M637 242 L637 318" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/><text x="646" y="290" font-size="12" fill="#59636e" text-anchor="start">trajectories</text><path d="M532 370 L486 370" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/><text x="509" y="362" font-size="12" fill="#59636e" text-anchor="middle">dev</text><path d="M382 322 L382 246" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/><text x="391" y="290" font-size="12" fill="#59636e" text-anchor="start">keep / revert</text><path d="M637 418 L637 446 L132 446 L132 246" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/><text x="384" y="440" font-size="12" fill="#59636e" text-anchor="middle">failed train trajectories</text><text x="832" y="360" font-size="12.5" fill="#59636e">After the last round:</text><text x="832" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">scripts/export.py</text><text x="832" y="400" font-size="12.5" fill="#59636e">harness + config +</text><text x="832" y="418" font-size="12.5" fill="#59636e">report + changelog</text></svg>
